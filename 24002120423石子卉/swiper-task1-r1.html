<!DOCTYPE html>
<!-- 石子卉 2026-11-10 GLM-5.3-Flash Swiper任务一第1轮配置缺陷验证页 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 1 轮配置实测 · 缺陷复现</title>
<link rel="stylesheet" href="../cdn/swiper/swiper-bundle.min.css">
<style>
  body { margin: 0; background: #D9E0E8; font-family: "Microsoft YaHei", sans-serif; }
  .szh_wrap { max-width: 640px; margin: 40px auto; background: #EDF1F5; padding: 22px; }
  .szh_title { font-size: 16px; margin: 0 0 6px; }
  .szh_note { font-size: 13px; color: #5A6B7C; margin: 0 0 16px; }
  .szh_status { font-size: 12px; background: #2C5490; color: #fff; padding: 3px 10px; display: inline-block; margin-bottom: 12px; }
  .swiper { width: 100%; aspect-ratio: 4 / 3; }
  .swiper img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>

<div class="szh_wrap">
  <span class="szh_status" id="szhStatus">初始化中…</span>
  <p class="szh_title">第 1 轮 AI 回答配置实测（#wySw4 · 缺陷复现）</p>
  <p class="szh_note">此页按第 1 轮回答的原样配置装载。请用鼠标在轮播上拖动一次，然后静置 4 秒以上——自动播放将不再继续。</p>

  <div class="swiper" id="wySw4">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="swiper-imgs/tiangong_1.jpg" alt="天宫空间站"></div>
      <div class="swiper-slide"><img src="swiper-imgs/fuxing_1.jpg" alt="复兴号动车组"></div>
      <div class="swiper-slide"><img src="swiper-imgs/c919_1.jpg" alt="C919大飞机"></div>
      <div class="swiper-slide"><img src="swiper-imgs/fendouzhe_1.jpg" alt="奋斗者号"></div>
      <div class="swiper-slide"><img src="swiper-imgs/fast_1.jpg" alt="中国天眼"></div>
    </div>
    <div class="swiper-pagination" id="wyPag4"></div>
  </div>
</div>

<script src="../cdn/swiper/swiper-bundle.min.js"></script>
<script>
// 实现第 1 轮 AI 回答的原样装载：仅基础配置，用于复现缺陷
window.addEventListener('load', function () {
  var szhStatus = document.getElementById('szhStatus');
  if (typeof Swiper === 'undefined') {
    szhStatus.textContent = 'Swiper 库加载失败';
    szhStatus.style.background = '#A63B25';
    return;
  }
  var szh_r1 = new Swiper('#wySw4', {
    loop: true,
    speed: 800,
    effect: 'cube',
    autoplay: { delay: 3200 },
    pagination: { el: '#wyPag4' }
  });
  // 实现状态徽章每秒刷新：实时显示自动播放是否仍在运行
  setInterval(function () {
    szhStatus.textContent = '第 1 轮配置 · autoplay=' + (szh_r1.autoplay.running ? '运行中' : '已停止（手动触发后不会恢复）') + ' · 圆点不可点击';
  }, 500);
});
</script>

</body>
</html>
