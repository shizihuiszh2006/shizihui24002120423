<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!-- 类 实例就是对象，两个要素 属性和方法
     学生的属性：学号、姓名、性别、年龄、班级
     方法：学习、睡觉、看电影、玩游戏 -->
</head>
<body>
    <script>
        // 创建对象
        var student = {
            sno: "2023001",
            name: "张三",
            sex: "男",
            age: 18,
            class: "高三(1)班",
            hobby: ["打篮球","踢足球","游泳"], // 数组类型
            study: function(){
                console.log("学习");
            },
            sleep: function(){
                console.log("睡觉");
            },
            watchMovie: function(){
                console.log("看电影");
            }
        }
        console.log(student.name);
        console.log(student.study());
        // 删除对象方法
        delete student.watchMovie;
        console.log("watchMovie" in student);
                // 对象的遍历
        for(var key in student){
            console.log(key,student[key]);
        }
         var o=student;
        console.log(o.name);
        o.name="一一";
        console.log("o的名字"+o.name);
        console.log("student的名字"+student.name); // 对象是引用类型，o和student指向同一个对象
    </script>
</body>
</html>
